name: movie-maker

# PR と merge queue は paths で絞らない。必須のチェックは報告が無いと待ち続けるので、changes ジョブで判定して
# 関係の無い変更ではジョブを飛ばす（飛ばしたジョブは成功と見なされる）。
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - "movie-maker/**"
      - ".github/workflows/movie-maker.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# main の push と夜間は同じ ref で走るので、event ごとに group を分ける。取り消すのは PR の古い実行だけ。
concurrency:
  group: movie-maker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NEXTEST_VERSION: 0.9.149
  # PR は軽い検査だけ。main の push、merge queue、手動では #[ignore] の通しの試験まで回す（scripts/nextest-ci.sh）。
  MM_HEAVY: ${{ github.event_name != 'pull_request' && '1' || '0' }}
  # 再試行で通ったテストの起票は、main に入るコード（push と merge queue）でだけする。
  MM_FILE_FLAKY: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && '1' || '0' }}

defaults:
  run:
    shell: bash
    working-directory: movie-maker

jobs:
  # movie-maker と ui/ に変更があるか。push、手動、夜間は常に true。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: origin/${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...HEAD" ;;
            merge_group) range="$MG_BASE...$MG_HEAD" ;;
            *) echo "rust=true" >> "$GITHUB_OUTPUT"; echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          changed() { if git diff --quiet "$range" -- "$@"; then echo false; else echo true; fi; }
          echo "rust=$(changed movie-maker .github/workflows/movie-maker.yml)" >> "$GITHUB_OUTPUT"
          echo "ui=$(changed movie-maker/ui movie-maker/crates/mm-ops/schema)" >> "$GITHUB_OUTPUT"

  # 外の SDK（FFmpeg、OCIO、CEF）無しの既定の設定。GPU は無いので GPU のテストは飛ぶ。
  check:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # キャッシュを書くのは main の push だけ。PR と merge queue は main のキャッシュを読む（書き込みの 2 分を払わない）。
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: movie-maker
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # OTIO の往復の試験（crates/mm-doc/tests/it/otio/python.rs）が Python の opentimelineio を呼ぶ。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install opentimelineio==0.18.1
      - name: テスト
        env:
          MM_REQUIRE_OTIO: "1"
        run: sh scripts/nextest-ci.sh --workspace
      # runner の GPU は WARP（D3D12 のソフトウェアの GPU）だけ。期待画像の warp 版があるときは、WARP で描いて
      # 必ず比べる（上のテストは版が無いとスキップするため）。無ければこの手順を飛ばす。
      # -p で絞ると依存の feature の組み合わせが変わって作り直しになるので、--workspace のビルドを filterset で絞る。
      - name: 期待画像（WARP）
        run: |
          if [ -d fixtures/golden/warp ]; then
            MM_GOLDEN_BACKEND=warp MM_REQUIRE_GOLDEN=1 MM_REQUIRE_GPU=1 cargo nextest run --workspace -E '(binary_id(mm-render::it) | binary_id(mm-pack::it)) & test(/^golden::/)'
          else
            echo "fixtures/golden/warp が無いので飛ばす"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-check
          path: movie-maker/target/nextest/*/junit*.xml
          if-no-files-found: ignore
          retention-days: 14

  # FFmpeg 9.0 の shared ビルドと feature `ffmpeg` を入れた検査。手順は crates/mm-decode-ffmpeg/README.md。
  ffmpeg:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FFMPEG_ZIP: ffmpeg-n9.0-latest-win64-gpl-shared-9.0
      FEATURES: mm-decode-ffmpeg/ffmpeg,mm-encode-ffmpeg/ffmpeg,mm-encode-nvenc/ffmpeg,mm-runtime/ffmpeg,mm/ffmpeg,mm-decode-d3d12va/d3d12va,mm-decode-cuvid/cuvid
      # feature で中身が変わるクレートと、PATH の ffmpeg を使う mm-ingest だけ。残りは check と同じ結果なので回さない。
      PACKAGES: >-
        -p mm-decode-ffmpeg -p mm-decode-ffmpeg-core -p mm-decode-hw -p mm-decode-d3d12va -p mm-decode-cuvid
        -p mm-encode-ffmpeg -p mm-encode-ffmpeg-core -p mm-encode-nvenc -p mm-runtime -p mm -p mm-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: movie-maker
          key: ffmpeg
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: FFmpeg を取って展開する
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.zip" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${FFMPEG_ZIP}.zip"
          7z x -y "$RUNNER_TEMP/ffmpeg.zip" -o"$RUNNER_TEMP/ffmpeg" > /dev/null
          root="$(cygpath -m "$RUNNER_TEMP/ffmpeg/$FFMPEG_ZIP")"
          echo "FFMPEG_DIR=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: LLVM（libclang）を確かめる
        run: |
          if [ ! -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
            choco install llvm -y --no-progress
          fi
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      - run: cargo clippy $PACKAGES --all-targets --features "$FEATURES" -- -D warnings
      - name: テスト
        run: sh scripts/nextest-ci.sh $PACKAGES --features "$FEATURES"
      - run: cargo run -p mm --features ffmpeg -- render fixtures/projects/stage0/project.json -o target/stage0-check.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-ffmpeg
          path: movie-maker/target/nextest/*/junit*.xml
          if-no-files-found: ignore
          retention-days: 14

  # 口（crates/mm-*-api）の破壊的変更を、PR の基点と比べて見つける。破壊的変更には版の繰り上げが要る。
  semver:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: movie-maker
          key: semver
      - uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-semver-checks@0.51.0
      - name: 口のクレートを基点と比べる
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          args=()
          for d in crates/mm-*-api; do args+=(-p "$(basename "$d")"); done
          cargo semver-checks "${args[@]}" --baseline-rev "$BASE"

  # 並行の PR が衝突しにくくなる決まり（ルートの Cargo.toml の並び、RFC の番号は PR の番号）。
  conventions:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 決まりを確かめる
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: sh scripts/check-conventions.sh

  # ui/（WebView の画面）の検査。PR と merge queue は movie-maker/ui/** か操作のスキーマ（crates/mm-ops/schema/**）を
  # 変えたときだけ回し、main への push と手動では常に回す。
  ui:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: movie-maker/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: movie-maker/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # build は generated/ops.ts を書き直すので、その前にコミット済みの内容が ops.json と合うかを見る。
      - run: pnpm gen:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # 性能の回帰のゲート（PR）。同じ runner で基点と PR の mm を交互に回して比べる。cpu の場面と、WARP で回す描画の場面
  # （playback、scrub）の 2 組。閾値の理由は docs/ci.md。
  perf-gate:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PERF_IRRELEVANT: '^movie-maker/(docs/|ui/|spikes/|tools/|xtask/|apps/movie-maker/|crates/(mm-ui-[^/]*|mm-host-[^/]*|mm-serve)/|.*/tests/|.*\.md$)'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 描画・書き出し・復号と、cpu の場面が測る操作と保存に関わらない変更（docs、ui、テストだけなど）では測らない。
      # ジョブ自体は成功で終わるので、必須のチェックとして扱える。
      - name: 性能に関わる変更があるか
        id: changed
        working-directory: .
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          relevant="$(git diff --name-only "$BASE...HEAD" -- movie-maker .github/workflows/movie-maker.yml | grep -vE "$PERF_IRRELEVANT" || true)"
          if [ -n "$relevant" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "性能に関わる変更が無いので測らない"
          fi
      # perf のキャッシュは main の perf-record が書く。
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: movie-maker
          key: perf
          save-if: ${{ github.event_name == 'push' }}
      # PR を先に作る。同じ target を基点と共有すると、後から作る側の古い mtime の元のファイルを cargo が
      # 新しいと見なさず、先に作った側のクレートを使い回す。基点の worktree は後で作るので mtime が新しく、作り直される。
      - name: PR の mm を作る
        if: steps.changed.outputs.run == 'true'
        run: |
          cargo build --release -p mm
          cp target/release/mm.exe "$RUNNER_TEMP/mm-head.exe"
      - name: 基点の mm を作る
        if: steps.changed.outputs.run == 'true'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base/movie-maker" && cargo build --release -p mm --target-dir "$GITHUB_WORKSPACE/movie-maker/target")
          cp target/release/mm.exe "$RUNNER_TEMP/mm-base.exe"
      - name: 比べる
        if: steps.changed.outputs.run == 'true'
        run: sh scripts/perf-gate.sh "$RUNNER_TEMP/mm-base.exe" "$RUNNER_TEMP/mm-head.exe" "$RUNNER_TEMP/perf"
      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.run == 'true'
        with:
          name: perf-gate
          path: ${{ runner.temp }}/perf
          retention-days: 14

  # main への push と夜間: CPU の場面を測って結果を残し、予算を超えた項目を issue にする。PR では起票しない。
  perf-record:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: movie-maker
          key: perf
      - run: cargo build --release -p mm
      - run: target/release/mm.exe perf run cpu --repeat 10 --out-dir perf-results
      - uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.sha }}
          path: movie-maker/perf-results
          retention-days: 90
      - name: 予算を超えた項目を起票する
        run: sh scripts/perf-file-issues.sh target/release/mm.exe perf-results
