[package]
name = "mm-runtime"
description = "組み立て。assemble(config) -> Engine、ノードの種類のレジストリ"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-types = { workspace = true }
mm-trace = { workspace = true }
mm-doc = { workspace = true }
mm-node-api = { workspace = true }
mm-render-api = { workspace = true }
mm-decode-api = { workspace = true }
mm-color-api = { workspace = true }
mm-audio-api = { workspace = true }
mm-text-api = { workspace = true }
mm-cache-api = { workspace = true }
mm-cache-fs = { workspace = true }
mm-testkit = { workspace = true }
mm-gpu = { workspace = true }
mm-render = { workspace = true }
mm-nodes-basic = { workspace = true }
mm-nodes-cef = { workspace = true }
mm-host-cef = { workspace = true }
mm-text-cef = { workspace = true }
mm-text-glyphon = { workspace = true }
mm-color-lut = { workspace = true }
mm-color-ocio = { workspace = true, optional = true }
mm-audio-dsp = { workspace = true }
mm-decode-ffmpeg = { workspace = true, optional = true }
mm-decode-ffmpeg-core = { workspace = true, optional = true }
mm-decode-d3d12va = { workspace = true, optional = true }
mm-decode-cuvid = { workspace = true, optional = true }
mm-encode-ffmpeg = { workspace = true, optional = true }
mm-encode-nvenc = { workspace = true, optional = true }
serde = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true }

[features]
# OpenColorIO を使う。OCIO_ROOT と libclang が要る（mm-color-ocio/README.md）。切ったときは ocio の腕が Unsupported を返す。
ocio = ["dep:mm-color-ocio", "mm-color-ocio/native"]
# FFmpeg の開発ファイルと libclang が要る（mm-decode-ffmpeg/README.md）。切ったときは ffmpeg の腕が Unsupported を返す。
ffmpeg = ["dep:mm-decode-ffmpeg", "dep:mm-decode-ffmpeg-core", "dep:mm-encode-ffmpeg", "dep:mm-encode-nvenc", "mm-decode-ffmpeg/gpu", "mm-encode-ffmpeg/ffmpeg", "mm-encode-nvenc/ffmpeg"]
# レンダラーと同じ D3D12 のデバイスの上でデコードする。実機の NVIDIA が要る。ffmpeg も入れると音が付く。
d3d12va = ["dep:mm-decode-d3d12va", "mm-decode-d3d12va/d3d12va"]
cuvid = ["dep:mm-decode-cuvid", "mm-decode-cuvid/cuvid"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[[example]]
name = "bench_frame_cache"
required-features = ["ffmpeg"]
