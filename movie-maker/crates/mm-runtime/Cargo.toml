[package]
name = "mm-runtime"
description = "組み立て。assemble(config) -> Engine、種類の登録簿"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-types = { workspace = true }
mm-trace = { workspace = true }
mm-doc = { workspace = true }
mm-node-api = { workspace = true }
mm-render-api = { workspace = true }
mm-decode-api = { workspace = true }
mm-color-api = { workspace = true }
mm-audio-api = { workspace = true }
mm-text-api = { workspace = true }
mm-cache-api = { workspace = true }
mm-testkit = { workspace = true }
mm-gpu = { workspace = true }
mm-render = { workspace = true }
mm-nodes-basic = { workspace = true }
mm-text-glyphon = { workspace = true }
mm-audio-dsp = { workspace = true }
mm-decode-ffmpeg = { workspace = true, optional = true }
mm-encode-ffmpeg = { workspace = true, optional = true }
serde = { workspace = true }
tracing = { workspace = true }

[features]
# FFmpeg の開発ファイルと libclang が要る（mm-decode-ffmpeg/README.md）。切ったときは ffmpeg の腕が Unsupported を返す。
ffmpeg = ["dep:mm-decode-ffmpeg", "dep:mm-encode-ffmpeg", "mm-decode-ffmpeg/ffmpeg", "mm-encode-ffmpeg/ffmpeg"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
