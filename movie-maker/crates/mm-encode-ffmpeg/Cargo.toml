[package]
name = "mm-encode-ffmpeg"
description = "FFmpeg のライブラリによるエンコーダー。H.264 と AAC の MP4 を書く"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-types = { workspace = true }
mm-audio-api = { workspace = true }
mm-decode-api = { workspace = true }
ffmpeg-next = { workspace = true, optional = true }

[features]
# FFmpeg の開発ファイルと libclang が要る。既定では切ってあり、切ったときは実装も契約テストもビルドしない。
ffmpeg = ["dep:ffmpeg-next", "mm-decode-ffmpeg/ffmpeg"]

[dev-dependencies]
mm-testkit = { workspace = true }
# 書き出した MP4 をリードバックしてフレームの番号を確かめる。テストだけの依存で、実装どうしの依存にはならない。
mm-decode-ffmpeg = { path = "../mm-decode-ffmpeg" }

[lints]
workspace = true
