[package]
name = "mm-color-ocio"
description = "OpenColorIO による色の変換。GLSL を naga で WGSL にし、テクスチャを持つ変換は 3D LUT に焼く"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# OCIO を実際に呼ぶ。環境変数 OCIO_ROOT（vcpkg の installed/<triplet>）と LIBCLANG_PATH が要る。
# 無ければこのクレートは GLSL → WGSL の変換だけを持つ。
native = ["dep:bindgen", "dep:cc"]
# 変換した WGSL を wgpu で実行して CPU の値と突き合わせる試験を有効にする。
gpu-eval = ["mm-color-lut/gpu-eval"]

[dependencies]
mm-types = { workspace = true }
mm-color-api = { workspace = true }
mm-color-lut = { workspace = true }
naga = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }
cc = { workspace = true, optional = true }

[dev-dependencies]
mm-testkit = { workspace = true }
mm-trace = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
