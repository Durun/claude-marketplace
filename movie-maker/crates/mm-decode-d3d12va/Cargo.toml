[package]
name = "mm-decode-d3d12va"
description = "試作。FFmpeg の d3d12va で復号した NV12 の ID3D12Resource を、コピーなしで wgpu のテクスチャに包むデコーダー"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 既定で切る。FFmpeg の開発ファイルと libclang が無い環境でもワークスペースをビルドできるようにする。
d3d12va = ["dep:ffmpeg-next", "dep:wgpu", "dep:pollster", "dep:windows"]

[dependencies]
mm-types = { workspace = true }
mm-audio-api = { workspace = true }
mm-decode-api = { workspace = true }
tracing = { workspace = true }
ffmpeg-next = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }

[dev-dependencies]
mm-trace = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "bench_d3d12va"
required-features = ["d3d12va"]

[lints]
workspace = true
