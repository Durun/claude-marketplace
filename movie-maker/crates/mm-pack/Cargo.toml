[package]
name = "mm-pack"
description = "パック（見た目の決まり、文字のスタイル、マクロ、テンプレート、ミキサーの設定）の読み込み、検査、操作の列への展開。操作経路（mm CLI、アプリ）が使う"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-types = { workspace = true }
mm-doc = { workspace = true }
mm-ops = { workspace = true }
# プレートの大きさを決めるために文字を組む（型だけ。シェーパーは呼ぶ側が渡す）。
mm-text-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
mm-gpu = { workspace = true }
mm-render = { workspace = true }
mm-render-api = { workspace = true }
mm-node-api = { workspace = true }
mm-nodes-basic = { workspace = true }
# web 手順のレイヤーを、CEF の代わりの描画（モックの矩形）で期待画像にする。
mm-nodes-cef = { workspace = true }
mm-color-lut = { workspace = true }
mm-testkit = { workspace = true }
wgpu = { workspace = true }
# トランジションを目で見るための PNG を書く。
png = { workspace = true }
# 検査のテストで、壊したパックを一時フォルダーに作る。
tempfile = { workspace = true }

[lints]
workspace = true
