[package]
name = "mm-host-cef"
description = "CEF のオフスクリーン描画を共有テクスチャで wgpu へ渡すホスト（段階 0 の試作）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# CEF の配布物（libcef.dll など、数百 MB）が要るので既定では切っておく。
cef = ["dep:cef", "dep:wgpu", "dep:pollster", "dep:png", "dep:tracing", "dep:tracing-subscriber", "dep:mm-trace"]

[dependencies]
cef = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
png = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
mm-trace = { workspace = true, optional = true }

[lints]
workspace = true
