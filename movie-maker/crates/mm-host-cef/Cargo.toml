[package]
name = "mm-host-cef"
description = "CEF のオフスクリーン描画を共有テクスチャで別プロセスのアプリへ渡すホスト（mm-host-api の実装）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# CEF の配布物（libcef.dll など、数百 MB）が要るので既定では切っておく。
# 切ったビルドでもアプリ側のランチャー（CefLauncher）とテストの枠はコンパイルする。
cef = ["dep:cef", "dep:wgpu", "dep:pollster", "dep:png", "dep:tracing", "dep:tracing-subscriber", "dep:mm-trace", "dep:mm-gpu"]

# sandbox つきの起動（CEF の bootstrapc.exe）が読み込む本体の DLL。bundle.sh が組み立てる。
[[example]]
name = "sandboxed"
crate-type = ["cdylib"]
required-features = ["cef"]

[dependencies]
mm-host-api = { workspace = true }
mm-types = { workspace = true }
serde_json = { workspace = true }
cef = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
png = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
mm-trace = { workspace = true, optional = true }
mm-gpu = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Media",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
mm-testkit = { workspace = true }
mm-gpu = { workspace = true }
wgpu = { workspace = true }

# テストが受け取った共有ハンドルの権限を読む。
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Wdk_Foundation", "Win32_System_WindowsProgramming"] }

[lints]
workspace = true
