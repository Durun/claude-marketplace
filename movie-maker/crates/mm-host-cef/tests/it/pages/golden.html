<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #204060; }
  #box { position: absolute; left: 10%; top: 20%; width: 30%; height: 40%; border-radius: 12px; background: linear-gradient(90deg, #ff5d73, #ffd166); }
  #dot { position: absolute; top: 35%; width: 20%; height: 30%; border-radius: 50%; background: #06d6a0; }
  #seq { position: absolute; left: 0; top: 0; width: 4px; height: 4px; }
</style>
<div id="box"></div><div id="dot"></div><div id="seq"></div>
<script>
  // 文字はフォントで画素が変わるので使わない。画面は時刻 t と params だけで決まる。
  window.mmSetTime = (t, params) => {
    document.getElementById('dot').style.left = (50 + 20 * t) + '%';
    document.getElementById('box').style.opacity = String(0.5 + 0.5 * Math.cos(t));
    if (params && params.seq !== undefined) {
      const s = params.seq;
      document.getElementById('seq').style.background = `rgb(${s & 255},${(s >> 8) & 255},0)`;
    }
    // 時間切れのテスト用。レンダラのスレッドを止める。
    if (params && params.busy_ms) {
      const end = performance.now() + params.busy_ms;
      while (performance.now() < end) {}
    }
  };
</script>
