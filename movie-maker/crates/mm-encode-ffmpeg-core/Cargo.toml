[package]
name = "mm-encode-ffmpeg-core"
description = "FFmpeg を使うエンコーダーの共通実装。コーデックの指定（CodecSpec）から MP4 と MOV を書く。H.264、ProRes、DNxHR、NVENC の実装クレートが使う"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# FFmpeg の開発ファイルと libclang が要る。既定では切ってあり、切ったときは空のクレートになる。
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
mm-types = { workspace = true }
mm-audio-api = { workspace = true }
mm-decode-api = { workspace = true }
ffmpeg-next = { workspace = true, optional = true }

[dev-dependencies]
# AAC のエンコーダーを開く試験の出力先。
tempfile = { workspace = true }

[lints]
workspace = true
