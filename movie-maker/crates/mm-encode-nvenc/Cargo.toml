[package]
name = "mm-encode-nvenc"
description = "NVENC（FFmpeg の h264_nvenc、hevc_nvenc）で H.264 と HEVC を書くエンコーダー。NVIDIA の GPU が無いと使えないと返す"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# FFmpeg の開発ファイルと libclang が要る。既定では切ってあり、切ったときは空のクレートになる。
ffmpeg = ["mm-encode-ffmpeg-core/ffmpeg"]

[dependencies]
mm-types = { workspace = true }
mm-decode-api = { workspace = true }
mm-encode-ffmpeg-core = { workspace = true }

[dev-dependencies]
mm-testkit = { workspace = true }

[lints]
workspace = true
