[package]
name = "mm-decode-cuvid"
description = "FFmpeg の cuvid（NVDEC）でデコードした CUDA のメモリを D3D12 の共有バッファへ 1 回コピーし、レンダラーと同じ wgpu のデバイスの上で Rgba16Float にして返すデコーダー"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 既定で切る。FFmpeg の開発ファイル、libclang、NVIDIA のドライバーが無い環境でもワークスペースをビルドできるようにする。
cuvid = [
  "dep:ffmpeg-next",
  "dep:wgpu",
  "dep:windows",
  "dep:mm-gpu",
  "mm-decode-hw/hw",
  "mm-decode-ffmpeg-core/ffmpeg",
]
# 検査のためだけの口（待ちを外した対照、故障の注入）。本番の組み立てでは入れない。
test-hooks = ["mm-decode-hw/test-hooks"]

[dependencies]
mm-types = { workspace = true }
mm-audio-api = { workspace = true }
mm-decode-api = { workspace = true }
mm-decode-ffmpeg-core = { workspace = true }
mm-decode-hw = { workspace = true }
mm-gpu = { workspace = true, optional = true }
tracing = { workspace = true }
ffmpeg-next = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader",
] }

[dev-dependencies]
# 統合テストだけが検査の口（test-hooks）を使う。
mm-decode-cuvid = { path = ".", features = ["test-hooks"] }
mm-decode-hw = { workspace = true, features = ["testing"] }
mm-trace = { workspace = true }
mm-testkit = { workspace = true }
mm-gpu = { workspace = true }
mm-node-api = { workspace = true }
wgpu = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "bench_cuvid"
required-features = ["cuvid"]

[lints]
workspace = true
