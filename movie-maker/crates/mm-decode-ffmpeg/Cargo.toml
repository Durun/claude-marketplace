[package]
name = "mm-decode-ffmpeg"
description = "FFmpeg のライブラリによるデコーダー。CPU の RGBA でフレームを返す"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-types = { workspace = true }
mm-audio-api = { workspace = true }
mm-decode-api = { workspace = true }
mm-decode-ffmpeg-core = { workspace = true }
mm-decode-hw = { workspace = true, optional = true }
mm-gpu = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
# FFmpeg の開発ファイルと libclang が要る。既定では切ってあり、切ったときは実装も契約テストもビルドしない。
ffmpeg = ["dep:ffmpeg-next", "mm-decode-ffmpeg-core/ffmpeg"]
# GPU のコンテキストを渡されたら、YUV のプレーンをそのまま上げてシェーダーで線形にする（CPU の変換を通らない）。
gpu = ["ffmpeg", "dep:mm-decode-hw", "mm-decode-hw/hw", "dep:mm-gpu", "dep:wgpu"]

[dev-dependencies]
mm-testkit = { workspace = true }
mm-gpu = { workspace = true }
mm-node-api = { workspace = true }

[lints]
workspace = true
