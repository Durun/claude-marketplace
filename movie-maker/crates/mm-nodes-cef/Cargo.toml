[package]
name = "mm-nodes-cef"
description = "web.cef のノードの種類。HTML と CSS のページを別プロセスの CEF で描き、共有テクスチャを wgpu のレイヤーにする"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-types = { workspace = true }
mm-node-api = { workspace = true }
mm-host-api = { workspace = true }
mm-gpu = { workspace = true }
wgpu = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D12"] }

[dev-dependencies]
mm-testkit = { workspace = true }
mm-host-cef = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
