<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; width: 1920px; height: 1080px; overflow: hidden; }
  #half { position: absolute; left: 100px; top: 100px; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.5); }
  #bar { position: absolute; top: 560px; width: 40px; height: 80px; background: #2050ff; }
  #label {
    position: absolute; left: 400px; top: 200px; font: 900 120px sans-serif; color: #ffd400;
    -webkit-text-stroke: 16px #1a1a1a; paint-order: stroke fill;
  }
</style>
</head>
<body>
<div id="half"></div>
<div id="bar"></div>
<div id="label"></div>
<script>
  window.mmSetTime = (t, data) => {
    document.getElementById('bar').style.left = (100 + 200 * t - 20) + 'px';
    document.getElementById('label').textContent = (data.label || '') + ' t=' + t.toFixed(2);
  };
</script>
</body>
</html>
