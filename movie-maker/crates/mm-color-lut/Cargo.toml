[package]
name = "mm-color-lut"
description = "色の変換のフォールバック。ASC CDL と .cube の 3D LUT を WGSL で適用する。OCIO が無くても動く"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# WGSL を wgpu の compute で実行して CPU の値と突き合わせる試験のツール。GPU の無い環境では呼び出し側がスキップする。
gpu-eval = ["dep:wgpu", "dep:pollster"]

[dependencies]
mm-types = { workspace = true }
mm-color-api = { workspace = true }
serde = { workspace = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[dev-dependencies]
mm-testkit = { workspace = true }
naga = { workspace = true }

[lints]
workspace = true
