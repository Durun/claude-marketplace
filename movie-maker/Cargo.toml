[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# 外のクレートの版はここに集約し、各クレートは `workspace = true` で参照する。
[workspace.dependencies]
mm-types = { path = "crates/mm-types" }
mm-trace = { path = "crates/mm-trace" }
mm-doc = { path = "crates/mm-doc" }
mm-node-api = { path = "crates/mm-node-api" }
mm-render-api = { path = "crates/mm-render-api" }
mm-decode-api = { path = "crates/mm-decode-api" }
mm-color-api = { path = "crates/mm-color-api" }
mm-audio-api = { path = "crates/mm-audio-api" }
mm-text-api = { path = "crates/mm-text-api" }
mm-host-api = { path = "crates/mm-host-api" }
mm-cache-api = { path = "crates/mm-cache-api" }
mm-ingest-api = { path = "crates/mm-ingest-api" }
mm-testkit = { path = "crates/mm-testkit" }
mm-runtime = { path = "crates/mm-runtime" }
mm-render = { path = "crates/mm-render" }
mm-nodes-basic = { path = "crates/mm-nodes-basic" }
mm-text-glyphon = { path = "crates/mm-text-glyphon" }
mm-audio-dsp = { path = "crates/mm-audio-dsp" }
mm-decode-ffmpeg = { path = "crates/mm-decode-ffmpeg" }
mm-encode-ffmpeg = { path = "crates/mm-encode-ffmpeg" }
mm-export = { path = "crates/mm-export" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# FFmpeg のバインディング。ビルドには FFmpeg の開発ファイルと libclang が要る（crates/mm-decode-ffmpeg/README.md）。
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
thiserror = "2.0"
tracing = "0.1"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
ebur128 = "0.1"
wgpu = "30.0.1"
half = "2.7"
pollster = "1.0"
bytemuck = { version = "1.20", features = ["derive"] }
png = "0.18"
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[workspace.lints.clippy]
all = "warn"
