[workspace]
resolver = "2"
# apps/* はアプリ（Tauri のウィンドウなど）。xtask は開発用のコマンド（cargo xtask）。
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# 外のクレートのバージョンはここに集約し、各クレートは `workspace = true` で参照する。
# 中のクレートは名前の順に並べる（末尾に足すと並行の PR が同じ行で衝突する）。scripts/check-conventions.sh が確かめる。
[workspace.dependencies]
mm-audio-api = { path = "crates/mm-audio-api" }
mm-audio-cpal = { path = "crates/mm-audio-cpal" }
mm-audio-dsp = { path = "crates/mm-audio-dsp" }
mm-cache-api = { path = "crates/mm-cache-api" }
mm-cache-fs = { path = "crates/mm-cache-fs" }
mm-color-api = { path = "crates/mm-color-api" }
mm-color-lut = { path = "crates/mm-color-lut" }
mm-color-ocio = { path = "crates/mm-color-ocio" }
mm-decode-api = { path = "crates/mm-decode-api" }
mm-decode-cuvid = { path = "crates/mm-decode-cuvid" }
mm-decode-d3d12va = { path = "crates/mm-decode-d3d12va" }
mm-decode-ffmpeg = { path = "crates/mm-decode-ffmpeg" }
mm-decode-ffmpeg-core = { path = "crates/mm-decode-ffmpeg-core" }
mm-decode-hw = { path = "crates/mm-decode-hw" }
mm-doc = { path = "crates/mm-doc" }
mm-encode-ffmpeg = { path = "crates/mm-encode-ffmpeg" }
mm-encode-ffmpeg-core = { path = "crates/mm-encode-ffmpeg-core" }
mm-encode-nvenc = { path = "crates/mm-encode-nvenc" }
mm-eval = { path = "crates/mm-eval" }
mm-export = { path = "crates/mm-export" }
mm-gpu = { path = "crates/mm-gpu" }
mm-host-api = { path = "crates/mm-host-api" }
mm-host-cef = { path = "crates/mm-host-cef" }
mm-ingest = { path = "crates/mm-ingest" }
mm-ingest-api = { path = "crates/mm-ingest-api" }
mm-node-api = { path = "crates/mm-node-api" }
mm-nodes-basic = { path = "crates/mm-nodes-basic" }
mm-nodes-cef = { path = "crates/mm-nodes-cef" }
mm-ops = { path = "crates/mm-ops" }
mm-pack = { path = "crates/mm-pack" }
mm-render = { path = "crates/mm-render" }
mm-render-api = { path = "crates/mm-render-api" }
mm-runtime = { path = "crates/mm-runtime" }
mm-serve = { path = "crates/mm-serve" }
mm-store = { path = "crates/mm-store" }
mm-testkit = { path = "crates/mm-testkit" }
mm-text-api = { path = "crates/mm-text-api" }
mm-text-cef = { path = "crates/mm-text-cef" }
mm-text-glyphon = { path = "crates/mm-text-glyphon" }
mm-trace = { path = "crates/mm-trace" }
mm-types = { path = "crates/mm-types" }
mm-ui-layout = { path = "crates/mm-ui-layout" }
mm-ui-wgpu = { path = "crates/mm-ui-wgpu" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# FFmpeg のバインディング。ビルドには FFmpeg の開発ファイルと libclang が要る（crates/mm-decode-ffmpeg/README.md）。
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
thiserror = "2.0"
# mm-eval と mm-ops の性質テスト。
proptest = "1.6"
# 操作の引数の JSON Schema（`mm op --schema`、MCP、ui/sdk の型の生成の元）。
schemars = "1.2"
tracing = "0.1"
wgpu = "30.0.1"
pollster = "1.0"
# wgpu-hal の D3D12 が使うバージョンにそろえる（ID3D12Resource などの型を受け渡すため）。
windows = "0.62"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# 日本語の文節の切れ目（BudouX の Rust 版。Chromium の `word-break: auto-phrase` の元になった分け方）。
budoux = "0.1.1"
glyphon = { version = "0.12", default-features = false }
# プレビューの音の出力（mm-audio-cpal）。
cpal = "0.18"
ebur128 = "0.1"
half = "2.7"
bytemuck = { version = "1.20", features = ["derive"] }
png = "0.18"
# mm-serve。127.0.0.1 だけで待つ HTTP（axum）と、その非同期の実行環境。
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
# 起動ごとのトークンの乱数。
getrandom = "0.3"
clap = { version = "4.5", features = ["derive"] }
# mm render の Ctrl+C を取り消しの旗にする。
ctrlc = "3"
# mm-store。SQLite は bundled で同梱する（FTS5 と JSON 関数が入る）。
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
# mm-ingest のコンテンツハッシュ。SHA-256 より桁違いに速く、mmap + rayon で大きな素材を複数コアで読める。
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

# 色の試作用。OCIO のブリッジ（bindgen、cc）、GLSL → WGSL（naga）、WGSL を GPU で確かめる試験（wgpu、pollster）。
naga = { version = "30.0", default-features = false, features = ["glsl-in", "wgsl-in", "wgsl-out"] }
bindgen = "0.73"
cc = "1.2"
# mm-host-ofx が OpenFX のプラグイン（.ofx の DLL）を読み込む。
libloading = "0.8"
# apps/movie-maker（ウィンドウの試作）が使う。
tauri = { version = "2", features = ["unstable"] }
tauri-build = "2"
# apps/movie-maker の Media パネルが開くファイルの選択ダイアログ。
rfd = { version = "0.15", default-features = false }
# CEF ホスト（mm-host-cef の `cef` feature）。wgpu のバージョンは cef クレートが要るバージョンに合わせる。
cef = { version = "156.3", default-features = false, features = ["accelerated_osr"] }

[workspace.lints.clippy]
all = "warn"

# テストのバイナリが多く、Windows ではデバッグ情報（PDB）の書き出しとリンクが重い。バックトレースに要る行番号だけ残す。
[profile.dev]
debug = "line-tables-only"

# 依存は書き換えないので最適化し、画像や proptest のテストの実行を速くする。作り直しの費用はキャッシュが払う。
[profile.dev.package."*"]
opt-level = 2
debug = false
