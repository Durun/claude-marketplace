<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>movie-maker spike</title>
<style>
  :root { --bg: #ece9d8; --accent: #316ac5; --line: #7f9db9; }
  html, body { margin: 0; height: 100%; background: var(--bg); font: 12px Tahoma, "Yu Gothic UI", sans-serif; }
  body { padding: 8px; box-sizing: border-box; overflow: hidden; }
  h1 { margin: 0 0 6px; font-size: 13px; color: #fff; background: linear-gradient(#fff0, #0000), var(--accent);
       padding: 3px 6px; border-radius: 3px; }
  .row { margin: 4px 0; }
  #tc { font: 22px Consolas, monospace; }
  #bar { height: 10px; background: #fff; border: 1px solid var(--line); border-radius: 3px; }
  #fill { height: 100%; width: 0; background: var(--accent); }
  #grid { display: grid; grid-template-columns: repeat(40, 1fr); gap: 1px; height: 120px; margin-top: 6px; }
  #grid div { background: var(--accent); transform-origin: bottom; }
  #keys { height: 90px; overflow: hidden; background: #fff; border: 1px solid var(--line); padding: 2px; font-family: Consolas, monospace; }
  input { width: 90%; }
</style>
</head>
<body>
<h1>WebView2: Inspector 相当</h1>
<div class="row">再生位置 <span id="tc">0.000</span> s (seq <span id="seq">0</span>)</div>
<div id="bar"><div id="fill"></div></div>
<div id="grid"></div>
<div class="row">ウィンドウ <span id="sz"></span> / devicePixelRatio <span id="dpr"></span></div>
<div class="row">フォーカス <span id="focus">?</span></div>
<div class="row"><input id="field" placeholder="ここをクリックしてキーを打つ"></div>
<div class="row">WebView に届いたキー</div>
<div id="keys"></div>
<script>
  const { invoke, Channel } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const nowUs = () => Math.round((performance.timeOrigin + performance.now()) * 1000);
  const $ = (id) => document.getElementById(id);
  const cells = [];
  for (let i = 0; i < 400; i++) { const d = document.createElement("div"); $("grid").appendChild(d); cells.push(d); }

  function onTick(msg) {
    const recv = nowUs();
    $("tc").textContent = msg.t.toFixed(3);
    $("seq").textContent = msg.seq;
    $("fill").style.width = ((msg.t % 10) * 10) + "%";
    for (let i = 0; i < cells.length; i++) {
      cells[i].style.transform = "scaleY(" + (0.2 + 0.8 * Math.abs(Math.sin(msg.t * 3 + i * 0.1))).toFixed(3) + ")";
    }
    requestAnimationFrame(() => {
      invoke("sync_ack", { seq: msg.seq, mode: msg.mode, recvUs: recv, rafUs: nowUs() });
    });
  }

  const ch = new Channel();
  ch.onmessage = onTick;
  invoke("subscribe", { onTick: ch });
  listen("playhead", (e) => onTick(e.payload));

  addEventListener("keydown", (e) => {
    invoke("key_event", { source: "webview", key: e.code });
    const k = $("keys"); k.textContent = (e.code + " " + k.textContent).slice(0, 200);
  });
  const report = () => {
    $("sz").textContent = innerWidth + "x" + innerHeight; $("dpr").textContent = devicePixelRatio;
    invoke("ui_size", { w: innerWidth, h: innerHeight, dpr: devicePixelRatio });
  };
  addEventListener("resize", report);
  addEventListener("focus", () => { $("focus").textContent = "WebView"; });
  addEventListener("blur", () => { $("focus").textContent = "(外)"; });
  report();
</script>
</body>
</html>
