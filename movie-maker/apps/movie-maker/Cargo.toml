[package]
name = "movie-maker"
description = "movie-maker のアプリ。Tauri のウィンドウに wgpu のサーフェス（Program と Timeline）と WebView2 を並べ、プロジェクトを開いて再生する"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# FFmpeg の開発ファイルが要る（mm-decode-ffmpeg/README.md）。切ったときは素材をモックのデコーダーで読む。
ffmpeg = ["mm-runtime/ffmpeg"]

[dependencies]
mm-types = { workspace = true }
mm-trace = { workspace = true }
mm-doc = { workspace = true }
mm-eval = { workspace = true }
mm-store = { workspace = true }
mm-node-api = { workspace = true }
mm-audio-api = { workspace = true }
mm-runtime = { workspace = true }
mm-ops = { workspace = true }
# Tauri のコマンド pack_list と pack_apply。パックのマクロを展開して適用する。
mm-pack = { workspace = true }
mm-serve = { workspace = true }
mm-ingest = { workspace = true }
mm-ingest-api = { workspace = true }
mm-export = { workspace = true }
mm-ui-layout = { workspace = true }
mm-ui-wgpu = { workspace = true }
mm-audio-cpal = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
tauri = { workspace = true }
rfd = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
mm-testkit = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
