[package]
name = "mm"
description = "movie-maker の CLI。mm new、import、export、op、proposal、pack、undo、redo、log、diff、ingest、render、perf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mm"
path = "src/main.rs"

[dependencies]
mm-types = { workspace = true }
mm-trace = { workspace = true }
mm-doc = { workspace = true }
mm-node-api = { workspace = true }
mm-runtime = { workspace = true }
# `perf run --adapter` が GPU の一覧を引く。
mm-gpu = { workspace = true }
mm-export = { workspace = true }
mm-ops = { workspace = true }
# `mm pack`。パックのマクロを展開して適用する。
mm-pack = { workspace = true }
mm-store = { workspace = true }
mm-ingest = { workspace = true }
mm-serve = { workspace = true }
# 文字起こしの付属ファイルの型（`mm ingest` が DB の入力に変換する）。
mm-ingest-api = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
# `perf run cpu` の保存のコミットの作業フォルダー。
tempfile = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# FFmpeg が要る。切ったときは mm render が「ffmpeg が切ってある」と拒否する（mm-decode-ffmpeg/README.md）。
ffmpeg = ["mm-runtime/ffmpeg", "mm-decode-ffmpeg/ffmpeg"]

[dev-dependencies]
mm-render = { workspace = true }
mm-render-api = { workspace = true }
mm-nodes-basic = { workspace = true }
mm-testkit = { workspace = true }
mm-decode-api = { workspace = true }
# 書き出した MP4 をリードバックしてフレームの番号を確かめる。feature ffmpeg のときだけテストが使う。
mm-decode-ffmpeg = { workspace = true }
# 本編とショートの通しで、カットの配置と素材の時刻を引く。
mm-eval = { workspace = true }
# ep03 の再現で、入力と前の書き出しがフィクスチャのものと同じか確かめる。
sha2 = { workspace = true }

[lints]
workspace = true
