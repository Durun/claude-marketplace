[package]
name = "mm"
description = "movie-maker の CLI。mm new、import、export、op、undo、redo、log、diff、ingest、render、perf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mm"
path = "src/main.rs"

[dependencies]
mm-types = { workspace = true }
mm-trace = { workspace = true }
mm-doc = { workspace = true }
mm-node-api = { workspace = true }
mm-runtime = { workspace = true }
mm-export = { workspace = true }
mm-ops = { workspace = true }
mm-store = { workspace = true }
mm-ingest = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# FFmpeg が要る。切ったときは mm render が「ffmpeg が切ってある」と拒否する（mm-decode-ffmpeg/README.md）。
ffmpeg = ["mm-runtime/ffmpeg", "mm-decode-ffmpeg/ffmpeg"]

[dev-dependencies]
mm-decode-api = { workspace = true }
# 書き出した MP4 をリードバックしてフレームの番号を確かめる。feature ffmpeg のときだけテストが使う。
mm-decode-ffmpeg = { workspace = true }
# CLI の結合テストの作業フォルダー。
tempfile = { workspace = true }

[lints]
workspace = true
