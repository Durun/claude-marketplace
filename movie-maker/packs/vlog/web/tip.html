<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  後から足す小ネタ（「ちなみに」の吹き出し）。ワイプのどぅるんから出す。data: head（見出し。｜の後ろは縦線で区切った添え）、
  body（本文。任意）、tag（左上の札。空なら出さない）、x と y（しっぽが指す点。ワイプの上の縁あたり）、side（吹き出しを置く側。
  left は点の左、right は右）、tail（down は点の上、up は点の下）、theme（展開が足す）。
  地と縁と影としっぽは 1 本の SVG のパスで描く。札は紙の縁にまたがって傾ける。
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #box { position: absolute; box-sizing: border-box; max-width: 900px; width: max-content; padding: 40px 44px 32px; }
  #box.notag { padding-top: 32px; }
  /* しっぽが上のときは札が下の縁にまたがるので、余白も上下を入れ替える。 */
  #box.up { padding: 32px 44px 40px; }
  .h { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; row-gap: 4px; margin: 0; }
  .h1 { font-size: 56px; font-weight: 900; line-height: 1.15; letter-spacing: 0.01em; white-space: nowrap; }
  .h2 { padding-left: 18px; border-left: 5px solid; font-size: 42px; font-weight: 900; line-height: 1.2; white-space: nowrap; }
  .b { margin: 12px 0 0; font-size: 42px; font-weight: 800; line-height: 1.42; word-break: auto-phrase; text-wrap: pretty; white-space: pre-wrap; }
  #tag {
    position: absolute; box-sizing: border-box; padding: 8px 26px 12px; border: 5px solid; border-radius: 30px;
    font-size: 40px; line-height: 1; white-space: nowrap; rotate: -5deg;
  }
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg"><path id="shadow"/><path id="plate"/></svg>
<div id="box"></div>
<div id="tag"></div>
<script>
  // 7_mix の小ネタの寸法（1 倍の画素）。縁 6、角丸 32、影は真下に 9、しっぽは付け根 52 で 64 伸びる。
  // しっぽの先は紙の外側の縁から EDGE の所。
  const BORDER = 6, RADIUS = 32, SHADOW = 9, TAIL = 64, BASE = 52, LEAN = 26, EDGE = 114;
  // 札の位置（紙の左上から）と、札の影のずれ。
  const TAG_X = 28, TAG_Y = -36, TAG_SHADOW = 5;

  const plate = (x0, y0, w, h, tail) => {
    const x1 = x0 + w, y1 = y0 + h, r = RADIUS;
    const [b0, b1] = tail.base, [tx, ty] = tail.tip;
    const top = tail.edge === 'top' ? [`H${b0}`, `L${tx},${ty}`, `L${b1},${y0}`] : [];
    const bottom = tail.edge === 'bottom' ? [`H${b1}`, `L${tx},${ty}`, `L${b0},${y1}`] : [];
    return [
      `M${x0 + r},${y0}`, ...top, `H${x1 - r}`, `A${r},${r} 0 0 1 ${x1},${y0 + r}`,
      `V${y1 - r}`, `A${r},${r} 0 0 1 ${x1 - r},${y1}`,
      ...bottom, `H${x0 + r}`, `A${r},${r} 0 0 1 ${x0},${y1 - r}`,
      `V${y0 + r}`, `A${r},${r} 0 0 1 ${x0 + r},${y0}`, 'Z',
    ].join(' ');
  };

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    e.className = cls;
    e.textContent = text;
    return e;
  };

  // 見出しは「｜」の前を大きな青、後ろを縦線の右の墨にする（7_mix の c2-tip の h1 と h2）。
  const fill = (box, data, colors) => {
    const [h1, ...rest] = String(data.head || '').split('｜');
    const head = el('p', 'h', '');
    const big = el('span', 'h1', h1);
    big.style.color = colors.sapphire || '#2459E0';
    head.append(big);
    if (rest.length) {
      const sub = el('span', 'h2', rest.join('｜'));
      sub.style.borderColor = `color-mix(in srgb, ${colors.sapphire || '#2459E0'} 22%, ${colors.paper || '#F5F8FF'})`;
      head.append(sub);
    }
    box.replaceChildren(head);
    if (data.body) box.append(el('p', 'b', String(data.body)));
  };

  window.mmSetTime = (t, data) => {
    const theme = data.theme || {};
    const colors = theme.colors || {};
    const fonts = theme.fonts || {};
    const ink = colors.ink || '#0B1230';
    const box = document.getElementById('box');
    fill(box, data, colors);
    box.style.color = ink;
    box.style.fontFamily = `"${fonts.body || 'M PLUS Rounded 1c'}", "Yu Gothic UI", "Meiryo", sans-serif`;
    const tagText = data.tag == null ? 'ちなみに' : String(data.tag);
    const up = data.tail === 'up';
    box.classList.toggle('notag', !tagText);
    box.classList.toggle('up', up && Boolean(tagText));
    const w = box.offsetWidth, h = box.offsetHeight;
    const tx = Number(data.x) || 0, ty = Number(data.y) || 0;
    const left = (data.side || 'left') !== 'right';
    const x0 = left ? tx + EDGE - w : tx - EDGE;
    const y0 = up ? ty + TAIL : ty - TAIL - h;
    // しっぽは紙の外側へ倒し、付け根の端より LEAN だけ外の点を指す（ワイプの方へ向く）。
    const base = left ? [tx - LEAN - BASE, tx - LEAN] : [tx + LEAN, tx + LEAN + BASE];
    box.style.left = x0 + 'px';
    box.style.top = y0 + 'px';
    const canvas = theme.canvas || { width: 1920, height: 1080 };
    const art = document.getElementById('art');
    art.setAttribute('width', canvas.width);
    art.setAttribute('height', canvas.height);
    const d = plate(x0, y0, w, h, { edge: up ? 'top' : 'bottom', tip: [tx, ty], base });
    const shadow = document.getElementById('shadow');
    shadow.setAttribute('d', d);
    shadow.setAttribute('fill', ink);
    shadow.setAttribute('transform', `translate(0 ${SHADOW})`);
    const body = document.getElementById('plate');
    body.setAttribute('d', d);
    body.setAttribute('fill', colors.paper || '#F5F8FF');
    body.setAttribute('stroke', ink);
    body.setAttribute('stroke-width', BORDER);
    body.setAttribute('stroke-linejoin', 'round');
    const tag = document.getElementById('tag');
    tag.textContent = tagText;
    tag.style.display = tagText ? 'block' : 'none';
    tag.style.background = colors.yellow || '#FFD43B';
    tag.style.borderColor = ink;
    tag.style.color = ink;
    tag.style.fontFamily = `"${fonts.sticker || 'Mochiy Pop One'}", "Yu Gothic UI", sans-serif`;
    tag.style.filter = `drop-shadow(0 ${TAG_SHADOW}px 0 ${ink})`;
    tag.style.left = x0 + TAG_X + 'px';
    tag.style.top = (up ? y0 + h - TAG_Y - tag.offsetHeight : y0 + TAG_Y) + 'px';
  };
</script>
</body>
</html>
