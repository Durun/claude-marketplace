<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  見出しの ToDo。紙にその回の ToDo を全部並べ、済んだ行はチェックと取り消し線、今の行は黄色の欄と再生の印とマーカー、
  先の行は点線の空の欄。data: list（「|」で区切った ToDo）、no（今の行。1 から）、text（list が無いときの 1 行）、
  tag（紙の札。既定「今日の ToDo」）、side（right か left）、plain（true なら札と欄なしで節の題だけ）、theme。
  影は紙と同じ形の墨の板を後ろにずらして置く（札が紙からはみ出すので、紙に filter を掛けると札にも影が付く）。
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-synthesis: none; }
  p { margin: 0; }
  svg { display: block; overflow: visible; }
  .todo { position: absolute; top: 76px; width: max-content; }
  .todo.mini { top: 96px; }
  .sheet { position: relative; rotate: -2deg; transform-origin: 30% 30%; }
  .shade, .panel { border-radius: 30px; }
  .shade { position: absolute; inset: 0; translate: 12px 14px; background: var(--ink); }
  .panel { position: relative; padding: 46px 52px 30px 40px; background: var(--paper); border: 7px solid var(--ink); }
  .tag { position: absolute; left: 30px; top: -36px; z-index: 3; padding: 9px 28px 13px; background: var(--yellow);
    border: 6px solid var(--ink); border-radius: 40px; filter: drop-shadow(0 6px 0 var(--ink));
    font: 700 40px/1 var(--sticker); color: var(--ink); rotate: -4deg; white-space: nowrap; }
  .rows { display: flex; flex-direction: column; gap: 18px; }
  .row { position: relative; display: flex; align-items: center; gap: 22px; white-space: nowrap; }
  .box { position: relative; width: 58px; height: 58px; flex: none; box-sizing: border-box; border-radius: 14px;
    border: 5px solid var(--ink); background: var(--white); }
  .tx { position: relative; font: 800 44px/1.25 var(--body); letter-spacing: .02em; color: var(--ink); }
  .done .box { background: var(--sapphire); }
  .done .box svg { position: absolute; left: 4px; top: 3px; }
  .done .tx { color: var(--done); }
  .strike { position: absolute; left: -6px; right: -6px; top: 52%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--sapphire); }
  .later .tx { color: var(--later); font-weight: 700; }
  .later .box { border-style: dashed; border-color: var(--later); background: transparent; }
  .cur { margin: 14px 0; }
  .cur .box { display: flex; align-items: center; justify-content: center; background: var(--yellow); }
  .cur .box svg { width: 30px; height: 30px; margin-left: 3px; }
  .cur .tx { font-weight: 900; line-height: 1.2; z-index: 0; }
  .mk { position: absolute; left: -10px; right: -10px; bottom: 6px; height: 36px; z-index: -1; background: var(--yellow); border-radius: 10px; }
  .long .panel { padding-top: 42px; padding-bottom: 24px; }
  .long .rows { gap: 10px; }
  .long .cur { margin: 6px 0; }
  .plain .panel { padding: 26px 52px 26px 48px; }
  .plain .cur { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // 紙の外の余白（1 倍の画素）。7_mix の card() と同じ。
  const SIDE_RIGHT = 84, SIDE_LEFT = 96;
  // 今の行の字の大きさの範囲と、紙の幅の目安（字の幅の単位の合計がこれを超えると縮める）。
  const CUR_MIN = 54, CUR_MAX = 70, CUR_WIDTH = 620;
  // 行の間を詰める項目の数。
  const LONG = 7;
  const CHECK = '<svg width="44" height="44" viewBox="0 0 44 44"><path d="M8 23 L18 33 L36 12" fill="none" stroke="var(--white)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const PLAY = '<svg viewBox="0 0 26 26"><path d="M7 4 L21 13 L7 22 Z" fill="var(--ink)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/></svg>';

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // 字の幅の目安（全角 1、半角 0.6）。
  const units = (s) => [...String(s ?? '')].reduce((a, ch) => a + (/[ -~]/.test(ch) ? 0.6 : 1), 0);
  const curSize = (s) => Math.max(CUR_MIN, Math.min(CUR_MAX, Math.floor(CUR_WIDTH / Math.max(1, units(s)))));

  const applyTheme = (theme) => {
    const s = document.documentElement.style;
    for (const [k, v] of Object.entries(theme.colors || {})) s.setProperty(`--${k}`, v);
    const f = theme.fonts || {};
    const stack = (name) => `"${name}", "Yu Gothic UI", "Meiryo", sans-serif`;
    s.setProperty('--body', stack(f.body));
    s.setProperty('--sticker', stack(f.sticker));
    // 済んだ行と先の行の字は、墨を紙で薄めた色（テーマの 5 色の外に色を足さない）。
    s.setProperty('--done', 'color-mix(in srgb, var(--ink) 75%, var(--paper))');
    s.setProperty('--later', 'color-mix(in srgb, var(--ink) 68%, var(--paper))');
  };

  const row = (item, state) => {
    if (state === 'done') {
      return `<div class="row done"><i class="box">${CHECK}</i><p class="tx">${esc(item)}<i class="strike"></i></p></div>`;
    }
    if (state === 'cur') {
      return `<div class="row cur"><i class="box">${PLAY}</i>`
        + `<p class="tx" style="font-size:${curSize(item)}px"><i class="mk"></i>${esc(item)}</p></div>`;
    }
    return `<div class="row later"><i class="box"></i><p class="tx">${esc(item)}</p></div>`;
  };

  window.mmSetTime = (t, data) => {
    applyTheme(data.theme || {});
    const list = String(data.list || '').split('|').map((s) => s.trim()).filter(Boolean);
    const items = list.length ? list : [String(data.text || '')];
    const cur = Math.min(items.length - 1, Math.max(0, (parseInt(data.no, 10) || 1) - 1));
    const side = data.side === 'left' ? 'left' : 'right';
    const at = `${side}:${side === 'right' ? SIDE_RIGHT : SIDE_LEFT}px`;
    const plain = data.plain === true || data.plain === 'true';
    const root = document.getElementById('root');
    if (plain) {
      root.innerHTML = `<div class="todo plain" style="${at}"><div class="sheet"><i class="shade"></i>`
        + `<div class="panel"><div class="rows"><div class="row cur"><p class="tx" style="font-size:${curSize(items[cur])}px">`
        + `<i class="mk"></i>${esc(items[cur])}</p></div></div></div></div></div>`;
      return;
    }
    const rows = items.map((item, i) => row(item, i < cur ? 'done' : i === cur ? 'cur' : 'later')).join('');
    const tag = data.tag || '今日の ToDo';
    const cls = `todo${data.tag ? ' mini' : ''}${items.length >= LONG ? ' long' : ''}`;
    root.innerHTML = `<div class="${cls}" style="${at}"><div class="sheet"><i class="shade"></i>`
      + `<div class="panel"><div class="rows">${rows}</div></div><span class="tag">${esc(tag)}</span></div></div>`;
  };
</script>
</body>
</html>
