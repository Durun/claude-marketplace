<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  画面の一点を指す吹き出し。data: text（文）、x と y（しっぽが指す点。コンポジションの画素）、
  side（right は指す点の右上、left は左上に置く）、theme（パックの色、書体、画面。展開が足す）。
  地と縁と影としっぽは 1 本の SVG のパスで描き、縁の継ぎ目を出さない。
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #text {
    position: absolute; box-sizing: border-box; max-width: 640px; padding: 16px 28px 18px;
    font-size: 40px; font-weight: 700; line-height: 1.35; letter-spacing: 0.02em;
    word-break: auto-phrase; overflow-wrap: anywhere; white-space: pre-wrap;
  }
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg"><path id="shadow"/><path id="plate"/></svg>
<div id="text"></div>
<script>
  // 吹き出しの寸法（1 倍の画素）。sticker の決まり（縁 5、影のずれ 7、角丸 8 より大きめの 22）に揃える。
  const BORDER = 5, SHADOW = 7, RADIUS = 22, TAIL = 72, BASE = 46, INSET = 64;

  const plate = (x0, y0, w, h, tip, base) => {
    const x1 = x0 + w, y1 = y0 + h, r = RADIUS;
    return [
      `M${x0 + r},${y0}`, `H${x1 - r}`, `A${r},${r} 0 0 1 ${x1},${y0 + r}`,
      `V${y1 - r}`, `A${r},${r} 0 0 1 ${x1 - r},${y1}`,
      `H${base[1]}`, `L${tip[0]},${tip[1]}`, `L${base[0]},${y1}`,
      `H${x0 + r}`, `A${r},${r} 0 0 1 ${x0},${y1 - r}`,
      `V${y0 + r}`, `A${r},${r} 0 0 1 ${x0 + r},${y0}`, 'Z',
    ].join(' ');
  };

  window.mmSetTime = (t, data) => {
    const theme = data.theme || {};
    const colors = theme.colors || {};
    const fonts = theme.fonts || {};
    const text = document.getElementById('text');
    text.textContent = data.text || '';
    text.style.color = colors.ink || '#0B1230';
    text.style.fontFamily = `"${fonts.body || 'M PLUS Rounded 1c'}", "Yu Gothic UI", "Meiryo", sans-serif`;
    const w = text.offsetWidth, h = text.offsetHeight;
    const tx = Number(data.x) || 0, ty = Number(data.y) || 0;
    const right = (data.side || 'right') !== 'left';
    const x0 = right ? tx - INSET : tx + INSET - w;
    const y0 = ty - TAIL - h;
    const mid = right ? x0 + INSET : x0 + w - INSET;
    text.style.left = x0 + 'px';
    text.style.top = y0 + 'px';
    const canvas = theme.canvas || { width: 1920, height: 1080 };
    const art = document.getElementById('art');
    art.setAttribute('width', canvas.width);
    art.setAttribute('height', canvas.height);
    const d = plate(x0, y0, w, h, [tx, ty], [mid - BASE / 2, mid + BASE / 2]);
    const shadow = document.getElementById('shadow');
    shadow.setAttribute('d', d);
    shadow.setAttribute('fill', colors.ink || '#0B1230');
    shadow.setAttribute('transform', `translate(${SHADOW} ${SHADOW})`);
    const body = document.getElementById('plate');
    body.setAttribute('d', d);
    body.setAttribute('fill', colors.paper || '#F5F8FF');
    body.setAttribute('stroke', colors.ink || '#0B1230');
    body.setAttribute('stroke-width', BORDER);
    body.setAttribute('stroke-linejoin', 'round');
  };
</script>
</body>
</html>
