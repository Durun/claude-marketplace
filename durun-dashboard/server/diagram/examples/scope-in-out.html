<!doctype html>
<meta charset="utf-8">
<title>例: スコープ IN / OUT</title>
<link rel="stylesheet" href="../assets/base.css">
<body>
<h1>スコープ</h1>
<!-- 使いどころ: すべての設計HTMLの冒頭。OUT側にも一言理由を書く（検討漏れと区別するため）。 -->
<div class="cols2">
  <div class="card">
    <h2 style="margin-top:0; border:0;">✅ 今回やる</h2>
    <ul>
      <li>共有リンクの発行 API <code>POST /api/notes/:noteId/share</code> の追加</li>
      <li>共有リンクでメモを開く <code>GET /s/:token</code> の追加</li>
      <li>有効期限（<code>share_links.expires_at</code>）を過ぎたリンクの失効</li>
    </ul>
  </div>
  <div class="card" style="color: var(--muted);">
    <h2 style="margin-top:0; border:0;">⏭ 今回やらない</h2>
    <ul>
      <li>パスワード付きの共有リンク：パスワードの保存方式が未確定のため次フェーズ</li>
      <li>共有先ごとの閲覧権限：リンクを知っていれば誰でも読める方式で開始し、需要が出てから</li>
    </ul>
  </div>
</div>
<script src="../assets/base.js"></script>
