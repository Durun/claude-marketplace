<!doctype html>
<meta charset="utf-8">
<title>例: 手書きSVGフロー図</title>
<link rel="stylesheet" href="../assets/base.css">
<body>
<h1>共有リンクでメモを開くリクエストフロー</h1>
<!-- 使いどころ: ノード間の接続関係そのものが情報のとき。矢印には必ずラベルを付ける（無ラベル矢印は「何か関係がある」しか伝えない）。 -->
<!-- viewBox でサイズを決めて CSS でスケール。線と文字は currentColor でテーマ両対応。意味色は変更点1色だけ。 -->
<!-- ノード15個を超えて交差だらけになったら図の粒度が間違っているサイン。分割する。 -->
<figure>
  <svg viewBox="0 0 640 150" role="img" aria-label="ブラウザが /s/:token にリクエストし、api が PostgreSQL から共有リンクとメモを取得して返すフロー">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
      </marker>
    </defs>
    <g fill="none" stroke="currentColor" stroke-width="1.2">
      <rect x="10" y="55" width="120" height="40" rx="6"/>
      <rect x="240" y="55" width="150" height="40" rx="6" stroke="var(--new)" stroke-width="2"/>
      <rect x="500" y="55" width="120" height="40" rx="6"/>
      <line x1="130" y1="68" x2="238" y2="68" marker-end="url(#arrow)"/>
      <line x1="238" y1="84" x2="130" y2="84" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
      <line x1="390" y1="68" x2="498" y2="68" marker-end="url(#arrow)"/>
      <line x1="498" y1="84" x2="390" y2="84" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
    </g>
    <g font-size="12" fill="currentColor" text-anchor="middle">
      <text x="70" y="79">ブラウザ</text>
      <text x="315" y="79" fill="var(--new)">api</text>
      <text x="560" y="79">PostgreSQL</text>
      <text x="184" y="60" font-size="10">GET /s/:token</text>
      <text x="184" y="98" font-size="10">200 (メモ)</text>
      <text x="444" y="60" font-size="10">find(token)</text>
      <text x="444" y="98" font-size="10">メモの行</text>
    </g>
  </svg>
  <figcaption>実線=リクエスト、破線=レスポンス。青枠が今回、エンドポイントを追加するコンポーネント。</figcaption>
</figure>
<script src="../assets/base.js"></script>
